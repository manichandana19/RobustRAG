project:
  name: rag-hallucination-detector
  seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed

model:
  name: microsoft/deberta-v3-base
  num_labels: 2
  max_length: 512

training:
  batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2e-05
  epochs: 3
  weight_decay: 0.01
  early_stopping_patience: 1
  bf16: true
  gradient_checkpointing: true
experiment:
  input_mode: ca

  # Supported modes:
  # qa  -> Question + Answer
  # ca  -> Context + Answer
  # qca -> Question + Context + Answer

baseline:
  input_mode: ca
  ngram_range: [1, 2]
  min_df: 2
  max_df: 0.95
  sublinear_tf: true
  max_iter: 1000
  C: 1.0
