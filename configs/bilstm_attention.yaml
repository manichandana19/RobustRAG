project:
  name: rag-hallucination-detector-bilstm
  seed: 42

data:
  processed_file: data/processed/ragtruth.jsonl
  output_dir: models/bilstm_attention_baseline

bilstm_model:
  vocab_size: 50000
  min_freq: 2
  embed_dim: 128
  hidden_dim: 128
  num_layers: 2
  dropout: 0.3
  use_attention: true
  attention_dim: 128
  max_length: 512
  truncation_strategy: context_tail

bilstm_training:
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 5
  grad_clip: 1.0
  use_class_weight: true
